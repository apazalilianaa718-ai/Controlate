<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriDash PRO - Panel Nutricional Inteligente</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.4);
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --card-border-hover: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body.light-mode {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      flex: 1;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding: 25px;
      background: linear-gradient(135deg, var(--card-bg) 0%, #1a233a 100%);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary-glow);
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
    }

    .filter-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #022c22;
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      border-color: var(--card-border-hover);
      transform: translateY(-2px);
    }

    .card.selected {
      border-color: var(--primary);
      background-color: #064e3b15;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-icon {
      font-size: 26px;
      background: #1e293b;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .card.selected .card-icon {
      background: var(--primary);
      color: #022c22;
    }

    .card-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }

    .badge-kcal {
      display: inline-block;
      background: #1e293b;
      color: #38bdf8;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 4px;
    }

    .nutrition-mini {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.4;
      border-top: 1px solid var(--card-border);
      padding-top: 8px;
    }

    .btn-action {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #022c22;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 800;
      margin-top: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 15, 0.85);
      backdrop-filter: blur(8px);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 25px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 70px rgba(0,0,0,0.9);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 20px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .summary-box {
      background: #0b0f19;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <!-- Modal Inicial de Perfil y Restricciones -->
  <div id="profile-modal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0f19; z-index: 999999; display: flex; justify-content: center; align-items: center; padding: 20px;">
    <div style="background: var(--card-bg); border: 2px solid var(--primary); padding: 25px; border-radius: 20px; width: 100%; max-width: 420px; color: var(--text);">
      <h2 style="color: var(--primary); text-align: center; margin-bottom: 8px;">NutriDash PRO</h2>
      <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 20px;">Configura tus datos para personalizar límites y restricciones nutricionales.</p>
      
      <form id="user-config-form">
        <div style="margin-bottom: 14px;">
          <label style="font-size: 12px; display: block; margin-bottom: 5px;">Edad:</label>
          <input type="number" id="u-age" required placeholder="Ej. 16" style="width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--card-border); color: var(--text); border-radius: 8px;">
        </div>

        <div style="margin-bottom: 14px;">
          <label style="font-size: 12px; display: block; margin-bottom: 5px;">Restricciones o Alergias:</label>
          <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px;">
            <label><input type="checkbox" name="restriction" value="lactosa"> Intolerancia a la Lactosa</label>
            <label><input type="checkbox" name="restriction" value="gluten"> Sensibilidad al Gluten / Celíaco</label>
            <label><input type="checkbox" name="restriction" value="azucar"> Dieta Baja en Azúcares (Diabetes / Cuidado)</label>
            <label><input type="checkbox" name="restriction" value="hipertension"> Dieta Baja en Sodio (Hipertensión)</label>
          </div>
        </div>

        <button type="submit" style="width: 100%; background: var(--primary); color: #022c22; border: none; padding: 12px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px;">Comenzar Mi Panel</button>
      </form>
    </div>
  </div>

  <div class="main-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div id="user-status-tag" style="font-size: 13px; background: var(--card-bg); border: 1px solid var(--primary); padding: 8px 14px; border-radius: 10px;">
        👤 Perfil no configurado
      </div>
      <button onclick="document.body.classList.toggle('light-mode')" style="background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: bold;">
        🌓 Cambiar Tema
      </button>
    </div>

    <header>
      <div class="logo">🥗 NutriDash PRO</div>
      <div class="subtitle">Control de calorías, información nutricional, límites por edad y alertas de restricciones.</div>
    </header>

    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-box" placeholder="Buscar alimento o bebida..." oninput="filtrarAlimentos()">
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filtrarCategoria('todos', this)">Todos</button>
        <button class="tab-btn" onclick="filtrarCategoria('comida', this)">Comidas</button>
        <button class="tab-btn" onclick="filtrarCategoria('bebida', this)">Bebidas</button>
        <button class="tab-btn" onclick="filtrarCategoria('snack', this)">Snacks y Postres</button>
      </div>
    </div>

    <div id="alimentosContainer" class="grid">
      <!-- Generado por JS -->
    </div>

    <button class="btn-action" onclick="analizarDietaSeleccionada()">📊 Generar Informe Nutricional y Análisis de Límites</button>
  </div>

  <!-- Modal de Resultados -->
  <div id="reportModal" class="modal-overlay" onclick="if(event.target === this) cerrarModal()">
    <div class="modal-content">
      <button class="close-btn" onclick="cerrarModal()">&times;</button>
      <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 15px; color: var(--primary);">📋 Informe Nutricional Personalizado</h3>
      <div id="reportContent"></div>
    </div>
  </div>

  <script>
    let usuarioEdad = 16;
    let restricciones = [];
    const seleccionados = new Set();

    const baseAlimentos = [
      { id: 'fettuccine', cat: 'comida', icon: '🍝', nombre: 'Fettuccine Alfredo', kcal: 620, proteinas: '18g', carbos: '75g', grasas: '28g', maxEdad: 'Máx. 2 porciones semanales (alto en grasas saturadas)', restricciones: ['gluten', 'lactosa'] },
      { id: 'manzana_pie', cat: 'snack', icon: '🥧', nombre: 'Pie de Manzana (Sin Horno)', kcal: 340, proteinas: '4g', carbos: '52g', grasas: '14g', maxEdad: 'Máx. 1 porción diaria (contenido de azúcares)', restricciones: ['gluten', 'azucar', 'lactosa'] },
      { id: 'lemon_pie', cat: 'snack', icon: '🍋', nombre: 'Crema de Limón para Pie', kcal: 280, proteinas: '5g', carbos: '42g', grasas: '10g', maxEdad: 'Máx. 1 porción diaria', restricciones: ['azucar', 'lactosa'] },
      { id: 'agua', cat: 'bebida', icon: '💧', nombre: 'Agua Pura', kcal: 0, proteinas: '0g', carbos: '0g', grasas: '0g', maxEdad: 'Sin límite (Recomendado 2L diarios)', restricciones: [] },
      { id: 'energizante', cat: 'bebida', icon: '⚡', nombre: 'Bebida Energizante', kcal: 110, proteinas: '0g', carbos: '28g', grasas: '0g', maxEdad: 'Máx. 1 lata diaria (menores de 18 años evitar)', restricciones: ['azucar'] },
      { id: 'hamburguesa', cat: 'comida', icon: '🍔', nombre: 'Comida Chatarra / Burger', kcal: 750, proteinas: '30g', carbos: '65g', grasas: '40g', maxEdad: 'Máx. 1 porción quincenal', restricciones: ['gluten', 'hipertension', 'lactosa'] },
      { id: 'ensalada', cat: 'comida', icon: '🥗', nombre: 'Ensalada Fresca de Vegetales', kcal: 150, proteinas: '4g', carbos: '12g', grasas: '8g', maxEdad: 'Sin límite diario', restricciones: [] },
      { id: 'jugo_fruta', cat: 'bebida', icon: '🧃', nombre: 'Jugo Natural de Fruta', kcal: 120, proteinas: '1g', carbos: '29g', grasas: '0g', maxEdad: 'Máx. 2 vasos diarios (fructosa libre)', restricciones: ['azucar'] }
    ];

    document.getElementById('user-config-form').addEventListener('submit', function(e) {
      e.preventDefault();
      usuarioEdad = parseInt(document.getElementById('u-age').value) || 16;
      restricciones = Array.from(document.querySelectorAll('input[name="restriction"]:checked')).map(cb => cb.value);
      
      document.getElementById('profile-modal').style.display = 'none';
      let restTxt = restricciones.length > 0 ? restricciones.join(', ') : 'Ninguna';
      document.getElementById('user-status-tag').innerHTML = `👤 Edad: ${usuarioEdad} años | Restricciones: <b>${restTxt}</b>`;
      renderAlimentos(baseAlimentos);
    });

    function renderAlimentos(lista) {
      const container = document.getElementById('alimentosContainer');
      container.innerHTML = '';

      lista.forEach(item => {
        let esIncompatible = false;
        let razonIncompatible = "";
        
        item.restricciones.forEach(r => {
          if (restricciones.includes(r)) {
            esIncompatible = true;
            razonIncompatible = `⚠️ Alerta: Contiene ${r} (Restringido en tu perfil)`;
          }
        });

        const card = document.createElement('div');
        card.className = `card ${seleccionados.has(item.id) ? 'selected' : ''}`;
        card.onclick = () => toggleSeleccion(item.id);

        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="card-icon">${item.icon}</div>
              <div>
                <div class="card-title">${item.nombre}</div>
                <div class="badge-kcal">🔥 ${item.kcal} kcal</div>
              </div>
            </div>
            <div class="nutrition-mini">
              <b>Proteínas:</b> ${item.proteinas} | <b>Carbos:</b> ${item.carbos} | <b>Grasas:</b> ${item.grasas}<br>
              <b>Límite recomendado:</b> ${item.maxEdad}
              ${esIncompatible ? `<br><span style="color: #ef4444; font-weight: bold;">${razonIncompatible}</span>` : ''}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleSeleccion(id) {
      if (seleccionados.has(id)) {
        seleccionados.delete(id);
      } else {
        seleccionados.add(id);
      }
      renderAlimentos(baseAlimentos);
    }

    function filtrarCategoria(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const query = document.getElementById('searchInput').value.toLowerCase();
      let filtrados = baseAlimentos.filter(item => {
        const matchCat = cat === 'todos' || item.cat === cat;
        const matchQuery = item.nombre.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });
      renderAlimentos(filtrados);
    }

    function filtrarAlimentos() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      let filtrados = baseAlimentos.filter(item => item.nombre.toLowerCase().includes(query));
      renderAlimentos(filtrados);
    }

    function analizarDietaSeleccionada() {
      const modal = document.getElementById('reportModal');
      const content = document.getElementById('reportContent');

      if (seleccionados.size === 0) {
        content.innerHTML = '<p style="color: var(--text-muted);">Por favor, selecciona al menos un alimento o bebida para generar tu informe nutricional.</p>';
        modal.classList.add('active');
        return;
      }

      let totalKcal = 0;
      let alertasRestriccion = [];
      let recomendacionesEdadHTML = "";

      seleccionados.forEach(id => {
        const item = baseAlimentos.find(a => a.id === id);
        if (item) {
          totalKcal += item.kcal;
          recomendacionesEdadHTML += `<div style="margin-bottom: 8px; font-size: 13.5px;"><b>${item.icon} ${item.nombre}:</b> ${item.maxEdad}</div>`;
          
          item.restricciones.forEach(r => {
            if (restricciones.includes(r)) {
              alertasRestriccion.push(`El alimento <b>${item.nombre}</b> infringe tu restricción de <b>${r}</b>.`);
            }
          });
        }
      });

      let caloriasRecomendadas = usuarioEdad < 18 ? 2200 : 2000;
      let estadoCalorias = totalKcal > caloriasRecomendadas ? "⚠️ Excede el estimado diario recomendado" : "🟢 Dentro del rango calórico estimado";

      let html = `
        <div class="summary-box">
          <h4 style="color: var(--primary); margin-bottom: 8px;">📊 Resumen Calórico Total</h4>
          <p style="font-size: 16px; font-weight: bold;">Total Consumido: ${totalKcal} kcal</p>
          <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Referencia para tu edad (${usuarioEdad} años): ~${caloriasRecomendadas} kcal/día (${estadoCalorias})</p>
        </div>
      `;

      if (alertasRestriccion.length > 0) {
        html += `
          <div class="summary-box" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.1);">
            <h4 style="color: #ef4444; margin-bottom: 8px;">🚨 Alertas de Restricciones Personales</h4>
            <ul style="padding-left: 20px; font-size: 13.5px; color: #fca5a5;">
              ${alertasRestriccion.map(a => `<li>${a}</li>`).join('')}
            </ul>
          </div>
        `;
      } else {
        html += `
          <div class="summary-box" style="border-color: #10b981; background: rgba(16, 185, 129, 0.1);">
            <h4 style="color: #10b981; margin-bottom: 8px;">✅ Restricciones Personales</h4>
            <p style="font-size: 13.5px;">Ninguno de los alimentos seleccionados infringe tus restricciones configuradas.</p>
          </div>
        `;
      }

      html += `
        <div class="summary-box">
          <h4 style="color: var(--primary); margin-bottom: 8px;">⏱️ Guía de Consumo Máximo por Edad (${usuarioEdad} años)</h4>
          ${recomendacionesEdadHTML}
        </div>
      `;

      content.innerHTML = html;
      modal.classList.add('active');
    }

    function cerrarModal() {
      document.getElementById('reportModal').classList.remove('active');
    }
  </script>
</body>
</html>
